<!doctype html><html lang="en"><head><meta charset="utf-8"><title>NCL Envelope C4</title>
<link rel="stylesheet" href="shared/common.css"><style>
.front{background:#fff}
.front .logo{left:16mm;top:14mm;width:72mm}
.front .logo-ar{right:16mm;top:16.76mm;height:6.55mm}
.front .strip{position:absolute;left:calc(-1*var(--b));right:calc(-1*var(--b));bottom:calc(-1*var(--b));height:calc(11.805mm + var(--b));background-color:var(--navy)}
.front .strip::before{content:"";position:absolute;left:0;right:0;top:0;height:2.432mm;background:var(--orange)}
.front .contact{position:absolute;left:16mm;bottom:14.305mm;font-size:7.472727272727273pt;font-weight:500;letter-spacing:.04em;color:var(--muted)}
.front .contact span{color:var(--orange);font-weight:700;margin:0 1.6mm}
.back{background:var(--slate)}
.back .flap{position:absolute;left:calc(-1*var(--b));top:calc(-1*var(--b));right:calc(-1*var(--b));height:calc(114.5mm + var(--b));
  background-color:#374858;clip-path:polygon(0 0,100% 0,100% 60.00%,50% 100%,0 60.00%)}
.back .flap-edge{position:absolute;left:calc(-1*var(--b));top:calc(-1*var(--b));right:calc(-1*var(--b));height:calc(114.5mm + var(--b))}
.back .logo{left:50%;transform:translateX(-50%);top:164.46mm;width:96mm}
</style></head><body>
<div class="sheet front" data-w="324" data-h="229">
  <img class="abs logo" src="../brand/logos/png/ncl-horizontal-full-colour.png" alt="">
  <img class="abs logo-ar" src="../brand/logos/png/ncl-arabic-navy.png" alt="">
  <div class="contact ltr">www.newcitylights.ir<span>·</span>+964 987 654 3210<span>·</span>Baghdad, Iraq</div>
  <div class="strip pat-navy"></div>
</div>
<div class="sheet back" data-w="324" data-h="229">
  <div class="flap pat-slate"></div>
  <svg class="flap-edge" viewBox="0 0 100 100" preserveAspectRatio="none" style="pointer-events:none" width="100%" height="100%"></svg>
  <img class="abs logo" src="../brand/logos/png/ncl-horizontal-on-dark.png" alt="">
</div>
<script src="shared/common.js"></script></body></html>
